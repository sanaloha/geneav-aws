services:
  clamav:
    image: clamav/clamav:1.3
    container_name: geneav-clamav
    ports:
      - "3310:3310"
    healthcheck:
      # clamdcheck.sh ships in the image and pings clamd
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # first run downloads the signature database
    volumes:
      - clamav-db:/var/lib/clamav

  backend:
    build: ./backend
    container_name: geneav-backend
    ports:
      - "8080:8080"
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      GENEAV_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      clamav:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: geneav-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  clamav-db:
