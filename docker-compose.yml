# Base definition of the stack, shared by local development and production.
#
# NOTE: no `ports:` here. Host port publishing lives in docker-compose.override.yml,
# which Compose auto-loads for a bare `docker compose up` but NOT when production
# passes explicit -f files. It has to be that way round: Compose MERGES (appends)
# list values like `ports:`, so a prod override cannot unpublish a port declared
# here — it can only add more. Keeping the base file portless is what makes
# "prod publishes nothing but Caddy's 80/443" actually true rather than
# firewall-dependent.
services:
  clamav:
    image: clamav/clamav:1.4
    container_name: geneav-clamav
    environment:
      # The image writes CLAMD_CONF_<Setting> env vars into clamd.conf at startup,
      # which is why this is not a mounted config file.
      #
      # Concurrent reload is ON by default: when freshclam pulls new signatures,
      # clamd loads the new database while the old one is still resident, which
      # transiently DOUBLES its memory. Turning it off trades a brief pause in
      # scanning during a reload for not being OOM-killed by a routine signature
      # update — the right trade on a single box with no failover.
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    healthcheck:
      # clamdcheck.sh ships in the image and pings clamd
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # first run downloads the signature database
    volumes:
      - clamav-db:/var/lib/clamav

  postgres:
    image: postgres:16-alpine
    container_name: geneav-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geneav}
      POSTGRES_USER: ${POSTGRES_USER:-geneav}
      # Dev default only; production sets a real password in .env.prod.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geneav}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geneav} -d ${POSTGRES_DB:-geneav}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: geneav-backend
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      GENEAV_ALLOWED_ORIGINS: http://localhost:3000
      # Persistence (accounts, API keys, usage).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-geneav}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-geneav}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-geneav}
      # Chat assistant (OpenAI). Empty unless set in the shell / .env / .env.prod;
      # when empty, /api/v1/chat returns 503 and the widget shows it's unconfigured.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Signup acknowledgement email. Disabled by default: the message is logged
      # instead of sent, and signup succeeds either way.
      GENEAV_MAIL_ENABLED: ${GENEAV_MAIL_ENABLED:-false}
      GENEAV_MAIL_FROM: ${GENEAV_MAIL_FROM:-no-reply@geneav.com}
      GENEAV_MAIL_FROM_NAME: ${GENEAV_MAIL_FROM_NAME:-geneav}
      GENEAV_MAIL_LOGIN_URL: ${GENEAV_MAIL_LOGIN_URL:-http://localhost:3000/login}
      GENEAV_MAIL_RESET_URL: ${GENEAV_MAIL_RESET_URL:-http://localhost:3000/reset-password}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Throttling knobs. application.yml already reads these; exposing them here
      # makes capacity work possible without rebuilding the image.
      #
      # ENABLED=false turns off the per-IP token bucket ONLY. The global
      # scan-max-concurrent semaphore is separate and stays on, which is what
      # scripts/benchmark-scan.sh needs: measure the scanner, not the limiter.
      # Never set false in production — it is the abuse control.
      GENEAV_RATELIMIT_ENABLED: ${GENEAV_RATELIMIT_ENABLED:-true}
      # Global cap on simultaneous scans, protecting ClamAV's memory footprint.
      # Raising it without re-running the benchmark is guessing.
      GENEAV_RATELIMIT_SCAN_CONCURRENCY: ${GENEAV_RATELIMIT_SCAN_CONCURRENCY:-4}
      # Microsoft Marketplace billing. Disabled by default: every
      # /api/v1/marketplace endpoint returns 503 and nothing else changes.
      GENEAV_MARKETPLACE_ENABLED: ${GENEAV_MARKETPLACE_ENABLED:-false}
      MARKETPLACE_TENANT_ID: ${MARKETPLACE_TENANT_ID:-}
      MARKETPLACE_CLIENT_ID: ${MARKETPLACE_CLIENT_ID:-}
      MARKETPLACE_CLIENT_SECRET: ${MARKETPLACE_CLIENT_SECRET:-}
      MARKETPLACE_PUBLISHER_ID: ${MARKETPLACE_PUBLISHER_ID:-}
      MARKETPLACE_OFFER_ID: ${MARKETPLACE_OFFER_ID:-geneav-scan-api}
      # Local-only escape hatch for scripts/replay-marketplace-webhook.sh, which
      # replays events with a self-minted token. NEVER set this in production.
      MARKETPLACE_RESOURCE_ID: ${MARKETPLACE_RESOURCE_ID:-20e940b3-4c77-4b0b-9a53-9e16a1b010a7}
      # "Sign in with Microsoft" (Entra OIDC). Off by default: no OAuth2 routes.
      GENEAV_MICROSOFT_LOGIN_ENABLED: ${GENEAV_MICROSOFT_LOGIN_ENABLED:-false}
      MICROSOFT_LOGIN_CLIENT_ID: ${MICROSOFT_LOGIN_CLIENT_ID:-}
      MICROSOFT_LOGIN_CLIENT_SECRET: ${MICROSOFT_LOGIN_CLIENT_SECRET:-}
    depends_on:
      clamav:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at BUILD time, so flipping this needs a
        # rebuild, not just a restart. Keep it in step with the backend's
        # GENEAV_MICROSOFT_LOGIN_ENABLED.
        NEXT_PUBLIC_MICROSOFT_LOGIN_ENABLED: ${NEXT_PUBLIC_MICROSOFT_LOGIN_ENABLED:-}
    container_name: geneav-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      # Server-side calls stay on the docker network; the browser-facing value
      # above is a localhost URL that means nothing inside this container.
      GENEAV_API_INTERNAL_URL: http://backend:8080
      # Demo key for the homepage scanner and chat widget, which now need one
      # (see ApiKeyAuthFilter). Mint one locally with:
      #   curl -sX POST localhost:8080/api/v1/signup -H 'Content-Type: application/json' \
      #        -d '{"email":"demo@localhost"}'
      # then put the returned apiKey in .env as GENEAV_DEMO_API_KEY and restart.
      # Unset just means the demo answers 503.
      GENEAV_DEMO_API_KEY: ${GENEAV_DEMO_API_KEY:-}
    depends_on:
      - backend

volumes:
  clamav-db:
  postgres-data:
