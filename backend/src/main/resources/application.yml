server:
  port: 8080

spring:
  application:
    name: geneav-scan-api
  servlet:
    multipart:
      # Reject uploads larger than this -> handled as HTTP 413
      max-file-size: 25MB
      max-request-size: 26MB

geneav:
  clamav:
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: 30000
  cors:
    allowed-origins: ${GENEAV_ALLOWED_ORIGINS:http://localhost:3000}
  openai:
    # Chat is disabled until an API key is provided; the /chat endpoint then returns 503.
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout-ms: 30000
    max-messages: 20
    max-chars-per-message: 4000

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
