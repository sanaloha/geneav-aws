server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax   # not sent on cross-site requests -> our CSRF mitigation
        # 'secure' is left to Spring's default (set automatically over HTTPS in prod).

spring:
  application:
    name: geneav-scan-api
  servlet:
    multipart:
      # Reject uploads larger than this -> handled as HTTP 413
      max-file-size: 25MB
      max-request-size: 26MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/geneav}
    username: ${SPRING_DATASOURCE_USERNAME:geneav}
    password: ${SPRING_DATASOURCE_PASSWORD:geneav}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates entities against it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    # SMTP transport. Unset by default; see geneav.mail.enabled below.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

geneav:
  auth:
    # Password-reset links. TTL is GN-8's 10 minutes; shorten it in a test
    # environment to exercise expiry without waiting.
    reset-token-ttl: ${GENEAV_RESET_TOKEN_TTL:10m}
    # Minimum gap between reset emails for one account, independent of source IP.
    reset-cooldown: ${GENEAV_RESET_COOLDOWN:60s}
    # Spent/expired tokens are swept after this long.
    reset-token-retention: ${GENEAV_RESET_TOKEN_RETENTION:24h}
    # Sweep cadence. Declared here (not only as @Scheduled defaults) so both are
    # env-overridable like every other tunable.
    reset-cleanup-interval-ms: ${GENEAV_RESET_CLEANUP_INTERVAL_MS:3600000}
    reset-cleanup-initial-delay-ms: ${GENEAV_RESET_CLEANUP_INITIAL_DELAY_MS:60000}
  clamav:
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: 30000
  cors:
    allowed-origins: ${GENEAV_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    # Off by default: signup acknowledgements are logged, not sent, until SMTP
    # is configured. Signup never fails because mail failed.
    enabled: ${GENEAV_MAIL_ENABLED:false}
    from: ${GENEAV_MAIL_FROM:no-reply@geneav.com}
    from-name: ${GENEAV_MAIL_FROM_NAME:geneav}
    login-url: ${GENEAV_MAIL_LOGIN_URL:http://localhost:3000/login}
    reset-url: ${GENEAV_MAIL_RESET_URL:http://localhost:3000/reset-password}
  openai:
    # Chat is disabled until an API key is provided; the /chat endpoint then returns 503.
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout-ms: 30000
    max-messages: 20
    max-chars-per-message: 4000
  ratelimit:
    # Per-client throttling for the public API (token bucket per endpoint + IP).
    # capacity = burst allowance; refill-per-minute = sustained rate. Tune per env.
    enabled: ${GENEAV_RATELIMIT_ENABLED:true}
    scan:
      capacity: ${GENEAV_RATELIMIT_SCAN_CAPACITY:10}
      refill-per-minute: ${GENEAV_RATELIMIT_SCAN_RPM:10}
    chat:
      capacity: ${GENEAV_RATELIMIT_CHAT_CAPACITY:15}
      refill-per-minute: ${GENEAV_RATELIMIT_CHAT_RPM:15}
    # Sign-in / sign-up / password reset. Tight and always per-IP: these are
    # human-paced, and a loose budget invites password guessing and mail-bombing.
    auth:
      capacity: ${GENEAV_RATELIMIT_AUTH_CAPACITY:5}
      refill-per-minute: ${GENEAV_RATELIMIT_AUTH_RPM:5}
    other:
      capacity: ${GENEAV_RATELIMIT_OTHER_CAPACITY:60}
      refill-per-minute: ${GENEAV_RATELIMIT_OTHER_RPM:60}
    # Global cap on simultaneous scans, protecting ClamAV's memory footprint.
    scan-max-concurrent: ${GENEAV_RATELIMIT_SCAN_CONCURRENCY:4}
    scan-acquire-timeout-ms: ${GENEAV_RATELIMIT_SCAN_ACQUIRE_TIMEOUT_MS:2000}
  plans:
    # Which plan a newly signed-up account gets.
    default-plan: free
    # Commercial tiers. monthly-scan-quota caps billable scans per calendar month
    # (402 when exhausted); rate-per-minute / burst are this plan's token bucket.
    definitions:
      free:
        monthly-scan-quota: ${GENEAV_PLAN_FREE_QUOTA:100}
        rate-per-minute: ${GENEAV_PLAN_FREE_RPM:10}
        burst: ${GENEAV_PLAN_FREE_BURST:10}
      pro:
        monthly-scan-quota: ${GENEAV_PLAN_PRO_QUOTA:100000}
        rate-per-minute: ${GENEAV_PLAN_PRO_RPM:120}
        burst: ${GENEAV_PLAN_PRO_BURST:60}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
