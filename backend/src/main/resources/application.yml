server:
  port: 8080
  # Honour X-Forwarded-Proto/-Host from Caddy so OAuth2 redirect URIs (Sign in
  # with Microsoft) are built as https://<host>/..., not http://backend:8080/....
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax   # not sent on cross-site requests -> our CSRF mitigation
        # 'secure' is left to Spring's default (set automatically over HTTPS in prod).

spring:
  application:
    name: geneav-scan-api
  servlet:
    multipart:
      # Reject uploads larger than this -> handled as HTTP 413
      max-file-size: 25MB
      max-request-size: 26MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/geneav}
    username: ${SPRING_DATASOURCE_USERNAME:geneav}
    password: ${SPRING_DATASOURCE_PASSWORD:geneav}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates entities against it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    # SMTP transport. Unset by default; see geneav.mail.enabled below.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

geneav:
  auth:
    # Password-reset links. TTL is GN-8's 10 minutes; shorten it in a test
    # environment to exercise expiry without waiting.
    reset-token-ttl: ${GENEAV_RESET_TOKEN_TTL:10m}
    # Minimum gap between reset emails for one account, independent of source IP.
    reset-cooldown: ${GENEAV_RESET_COOLDOWN:60s}
    # Spent/expired tokens are swept after this long.
    reset-token-retention: ${GENEAV_RESET_TOKEN_RETENTION:24h}
    # Sweep cadence. Declared here (not only as @Scheduled defaults) so both are
    # env-overridable like every other tunable.
    reset-cleanup-interval-ms: ${GENEAV_RESET_CLEANUP_INTERVAL_MS:3600000}
    reset-cleanup-initial-delay-ms: ${GENEAV_RESET_CLEANUP_INITIAL_DELAY_MS:60000}
    # "Sign in with Microsoft" (Entra ID OIDC). Off by default: with no client
    # credentials the login button is not rendered and no OAuth2 routes exist.
    # The app registration is MULTI-tenant (any Entra org or MSA can sign in);
    # issuer validation is per-token, see MicrosoftOidcConfig.
    microsoft:
      enabled: ${GENEAV_MICROSOFT_LOGIN_ENABLED:false}
      client-id: ${MICROSOFT_LOGIN_CLIENT_ID:}
      client-secret: ${MICROSOFT_LOGIN_CLIENT_SECRET:}
      # Where the browser lands after a completed Microsoft sign-in.
      post-login-url: ${GENEAV_MICROSOFT_POST_LOGIN_URL:http://localhost:3000/login}
  clamav:
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: 30000
  cors:
    allowed-origins: ${GENEAV_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    # Off by default: signup acknowledgements are logged, not sent, until SMTP
    # is configured. Signup never fails because mail failed.
    enabled: ${GENEAV_MAIL_ENABLED:false}
    from: ${GENEAV_MAIL_FROM:no-reply@geneav.com}
    from-name: ${GENEAV_MAIL_FROM_NAME:geneav}
    login-url: ${GENEAV_MAIL_LOGIN_URL:http://localhost:3000/login}
    reset-url: ${GENEAV_MAIL_RESET_URL:http://localhost:3000/reset-password}
  chat:
    # Predefined questions shown as chips in the widget. Picking one is answered
    # straight from here — no model call, no tokens — which is the whole point of
    # offering them. Keep the wording in step with ChatService.SYSTEM_PROMPT and
    # the site FAQ (frontend/app/page.tsx); three copies that disagree would be
    # worse than no chips at all. Answers stay short: they render in a 380px bubble.
    suggestions:
      - id: file-size
        question: "What is the maximum file size?"
        answer: "Up to 25 MB per upload. Anything larger returns 413."
      - id: file-types
        question: "What file types are supported?"
        answer: "PDF, Microsoft Office documents, plain text, CSV, RTF, and ZIP archives. Unsupported types return 415."
      - id: retention
        question: "Do you store the documents I send?"
        answer: "No. Files are streamed to the scan engine and discarded once the verdict is produced — never written to disk."
      - id: quota
        question: "What happens when I hit my quota?"
        answer: "You get an explicit 402 when the monthly scan quota is exhausted, and a 429 with a Retry-After header if you exceed the per-minute rate limit. Nothing fails silently."
      - id: detection
        question: "What does geneav actually detect?"
        answer: "Known malware, viruses, trojans, worms, and malicious documents, using ClamAV's signature database. Like any signature-based scanner it complements layered security rather than replacing it."
  openai:
    # Chat is disabled until an API key is provided; the /chat endpoint then returns 503.
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout-ms: 30000
    max-messages: 20
    max-chars-per-message: 4000
  ratelimit:
    # Per-client throttling for the public API (token bucket per endpoint + IP).
    # capacity = burst allowance; refill-per-minute = sustained rate. Tune per env.
    enabled: ${GENEAV_RATELIMIT_ENABLED:true}
    scan:
      capacity: ${GENEAV_RATELIMIT_SCAN_CAPACITY:10}
      refill-per-minute: ${GENEAV_RATELIMIT_SCAN_RPM:10}
    chat:
      capacity: ${GENEAV_RATELIMIT_CHAT_CAPACITY:15}
      refill-per-minute: ${GENEAV_RATELIMIT_CHAT_RPM:15}
    # Sign-in / sign-up / password reset. Tight and always per-IP: these are
    # human-paced, and a loose budget invites password guessing and mail-bombing.
    auth:
      capacity: ${GENEAV_RATELIMIT_AUTH_CAPACITY:5}
      refill-per-minute: ${GENEAV_RATELIMIT_AUTH_RPM:5}
    other:
      capacity: ${GENEAV_RATELIMIT_OTHER_CAPACITY:60}
      refill-per-minute: ${GENEAV_RATELIMIT_OTHER_RPM:60}
    # Global cap on simultaneous scans, protecting ClamAV's memory footprint.
    scan-max-concurrent: ${GENEAV_RATELIMIT_SCAN_CONCURRENCY:4}
    scan-acquire-timeout-ms: ${GENEAV_RATELIMIT_SCAN_ACQUIRE_TIMEOUT_MS:2000}
  plans:
    # Which plan a newly signed-up account gets.
    default-plan: free
    # Commercial tiers. monthly-scan-quota caps billable scans per calendar month
    # (402 when exhausted); rate-per-minute / burst are this plan's token bucket.
    # Prices are not modelled here — the backend meters, the pricing page sells.
    # NOTE: scale's 300/min is 5/sec, above scan-max-concurrent (4). A single
    # scale account at full rate can therefore queue on the global semaphore;
    # raise the concurrency cap (and the VM) before selling that tier hard.
    definitions:
      free:
        monthly-scan-quota: ${GENEAV_PLAN_FREE_QUOTA:500}
        rate-per-minute: ${GENEAV_PLAN_FREE_RPM:10}
        burst: ${GENEAV_PLAN_FREE_BURST:10}
      starter:
        monthly-scan-quota: ${GENEAV_PLAN_STARTER_QUOTA:10000}
        rate-per-minute: ${GENEAV_PLAN_STARTER_RPM:30}
        burst: ${GENEAV_PLAN_STARTER_BURST:30}
      pro:
        monthly-scan-quota: ${GENEAV_PLAN_PRO_QUOTA:100000}
        rate-per-minute: ${GENEAV_PLAN_PRO_RPM:120}
        burst: ${GENEAV_PLAN_PRO_BURST:60}
      scale:
        monthly-scan-quota: ${GENEAV_PLAN_SCALE_QUOTA:500000}
        rate-per-minute: ${GENEAV_PLAN_SCALE_RPM:300}
        burst: ${GENEAV_PLAN_SCALE_BURST:150}

  marketplace:
    # SaaS fulfillment against Microsoft's marketplace API.
    #
    # DORMANT since 2 Aug 2026: the channel was dropped from the site and the
    # /marketplace pages deleted, so nothing reaches these endpoints. Kept
    # because the contract is implemented and tested; re-enabling needs the
    # frontend surface rebuilt as well as the credentials below.
    # Disabled by default, mirroring geneav.mail and geneav.openai: with no
    # credentials every /api/v1/marketplace endpoint returns 503 and the site
    # behaves exactly as it does today. The webhook still requires a valid
    # Entra JWT even when enabled — see WebhookJwtValidator.
    enabled: ${GENEAV_MARKETPLACE_ENABLED:false}
    # The single-tenant fulfillment app (App B in the deploy notes), NOT the
    # multi-tenant sign-in app. Its tenant + client id are what Partner Center's
    # Technical Configuration holds and what the webhook JWT is validated against.
    tenant-id: ${MARKETPLACE_TENANT_ID:}
    client-id: ${MARKETPLACE_CLIENT_ID:}
    client-secret: ${MARKETPLACE_CLIENT_SECRET:}
    # Marketplace API contract. The resource id is fixed by Microsoft and is the
    # token scope (…/.default) as well as the appid/azp the webhook JWT carries.
    # Overridable ONLY so scripts/replay-marketplace-webhook.sh can replay events
    # locally with a self-minted token; never override it in production.
    api-base-url: ${MARKETPLACE_API_BASE_URL:https://marketplaceapi.microsoft.com/api/saas}
    api-version: "2018-08-31"
    resource-id: ${MARKETPLACE_RESOURCE_ID:20e940b3-4c77-4b0b-9a53-9e16a1b010a7}
    login-base-url: ${MARKETPLACE_LOGIN_BASE_URL:https://login.microsoftonline.com}
    # Offer identity, used to build the public listing URL and sanity-check
    # resolved purchases. Offer and plan ids are PERMANENT once published.
    publisher-id: ${MARKETPLACE_PUBLISHER_ID:}
    offer-id: ${MARKETPLACE_OFFER_ID:geneav-scan-api}
    # Partner Center plan id -> geneav plan key (geneav.plans.definitions).
    # An id missing here changes no plan and logs loudly; it must never
    # default to a bigger tier than was paid for.
    plan-map:
      geneav-starter: starter
      geneav-pro: pro
      geneav-scale: scale
    # Expiry sweep: downgrades accounts whose subscription lapsed. Cadence is
    # env-overridable like every other tunable (cf. geneav.auth.reset-cleanup-*).
    expiry-sweep-interval-ms: ${GENEAV_MARKETPLACE_EXPIRY_SWEEP_INTERVAL_MS:3600000}
    expiry-sweep-initial-delay-ms: ${GENEAV_MARKETPLACE_EXPIRY_SWEEP_INITIAL_DELAY_MS:120000}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
