name: CI/CD

# CI runs on every PR and on pushes to main.
# CD (SSH deploy) runs only on pushes to main, and only after both test jobs pass.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------- backend
  backend-test:
    name: Backend · mvn test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: mvn -B clean test

  # --------------------------------------------------------------- frontend
  frontend-build:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (proves the production bundle compiles)
        run: npm run build

  # ----------------------------------------------------------------- deploy
  # SSH into the Azure VM, pull the new code, and rebuild the stack.
  # Requires these repo secrets (Settings → Secrets and variables → Actions):
  #   SSH_HOST  — VM public IP (or hostname)
  #   SSH_USER  — e.g. azureuser
  #   SSH_KEY   — the PRIVATE SSH key whose public half is on the VM
  # Assumes the repo is already cloned at ~/geneav on the VM with a valid .env.prod.
  deploy:
    name: Deploy to Azure VM
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/geneav
            git pull --ff-only origin main
            docker compose --env-file .env.prod \
              -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker image prune -f
