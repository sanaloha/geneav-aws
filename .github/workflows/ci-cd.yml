name: CI/CD

# CI runs on every PR and on pushes to main.
# CD (SSH deploy) runs only on pushes to main, and only after both test jobs pass.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------- backend
  backend-test:
    name: Backend · mvn test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: mvn -B clean test

  # --------------------------------------------------------------- frontend
  frontend-build:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (proves the production bundle compiles)
        run: npm run build

  # ----------------------------------------------------------------- deploy
  # Ships the commit to the VM through the Azure control plane (run-command).
  #
  # This deliberately does NOT use SSH. The previous SSH-based job could never
  # have worked: GitHub-hosted runners have dynamic egress IPs but the VM's NSG
  # only allows port 22 from a couple of fixed addresses, and it ran `git pull`
  # on a VM that holds no credentials for this private repo. run-command needs
  # no inbound port and no repo access on the VM.
  #
  # Requires these repo secrets (Settings → Secrets and variables → Actions),
  # from an Entra app federated to this repo — see the setup notes in README:
  #   AZURE_CLIENT_ID        — app registration (client) id
  #   AZURE_TENANT_ID        — directory (tenant) id
  #   AZURE_SUBSCRIPTION_ID  — target subscription
  # There is no client secret: auth is OIDC, so no long-lived credential is
  # stored in GitHub. The old SSH_HOST / SSH_USER / SSH_KEY secrets are unused
  # and should be deleted.
  deploy:
    name: Deploy to Azure VM
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token azure/login exchanges
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: ./scripts/deploy-vm.sh
