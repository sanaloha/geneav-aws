name: CI/CD

# CI runs on every PR and on pushes to main.
# CD runs only on pushes to main, and only after both test jobs pass.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------- backend
  backend-test:
    name: Backend · mvn test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: mvn -B clean test

  # --------------------------------------------------------------- frontend
  frontend-build:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (proves the production bundle compiles)
        run: npm run build

  # ------------------------------------------------------------------ images
  # Built here, not on the box. Previously the deploy shipped the whole source
  # tree through the cloud control plane and the box compiled both apps — which
  # meant builds contended with live traffic, and in July 2026 the payload
  # outgrew the control plane's script-size limit and blocked deploys entirely.
  #
  # Tagged with the commit SHA so a deploy is a pull of a known artifact and a
  # rollback is re-pointing at the previous tag. The ECR repositories are set to
  # IMMUTABLE tags, so a SHA cannot later be repointed at different bytes.
  #
  # Auth is GitHub OIDC -> IAM role: no long-lived AWS key is stored in GitHub,
  # and the role's trust policy pins both the repo and the ref.
  #
  # Requires (Settings → Secrets and variables → Actions):
  #   secret   AWS_ROLE_ARN   — arn:aws:iam::<acct>:role/geneav-ci
  #   variable AWS_REGION     — e.g. us-east-1
  #   variable ECR_REGISTRY   — <acct>.dkr.ecr.<region>.amazonaws.com
  # All created by aws-provision.sh, which prints them at the end.
  images:
    name: Build & push images
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token STS exchanges for role credentials
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: AWS login (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        run: |
          docker build -t "${{ vars.ECR_REGISTRY }}/geneav-backend:$GITHUB_SHA" ./backend
          docker push "${{ vars.ECR_REGISTRY }}/geneav-backend:$GITHUB_SHA"

      # NEXT_PUBLIC_* are inlined into the client bundle at BUILD time, so they
      # have to be supplied here rather than living in .env.prod on the box as
      # they used to. None are secrets — they ship to every browser — so they
      # are repository *variables*, not secrets.
      - name: Build & push frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ vars.NEXT_PUBLIC_API_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_UMAMI_WEBSITE_ID="${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}" \
            --build-arg NEXT_PUBLIC_MICROSOFT_LOGIN_ENABLED="${{ vars.NEXT_PUBLIC_MICROSOFT_LOGIN_ENABLED }}" \
            -t "${{ vars.ECR_REGISTRY }}/geneav-frontend:$GITHUB_SHA" ./frontend
          docker push "${{ vars.ECR_REGISTRY }}/geneav-frontend:$GITHUB_SHA"

      # Caddy needs a custom image because the per-IP rate-limit handler is a
      # plugin compiled into the binary (caddy/Dockerfile). It is built here for
      # the same reason as the other two: the deploy is `up --no-build`, so a
      # `build:` in the compose file could only work on a box that had already
      # built it once — never on a freshly provisioned instance.
      #
      # Tagged with the SHA like the others even though caddy/ rarely changes, so
      # that one tag identifies the whole stack and a rollback moves all three
      # together. The xcaddy compile adds a couple of minutes per push.
      - name: Build & push caddy
        run: |
          docker build -t "${{ vars.ECR_REGISTRY }}/geneav-caddy:$GITHUB_SHA" ./caddy
          docker push "${{ vars.ECR_REGISTRY }}/geneav-caddy:$GITHUB_SHA"

  # ----------------------------------------------------------------- deploy
  # Ships the commit to the Lightsail box through AWS Systems Manager Run
  # Command.
  #
  # This deliberately does NOT use SSH. The previous SSH-based job could never
  # have worked: GitHub-hosted runners have dynamic egress IPs, and an
  # allow-list of them is not maintainable. SSM needs no inbound port at all —
  # the agent on the box polls outbound — and the Lightsail firewall
  # consequently has no port 22 rule.
  #
  # Requires, in addition to the three above:
  #   variable GENEAV_SSM_NODE — the mi-... managed node id, from
  #     `aws ssm describe-instance-information`
  # The old AZURE_* / ACR_* / SSH_* secrets and variables are unused and should
  # be deleted from the repository settings.
  deploy:
    name: Deploy to Lightsail
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: AWS login (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Pulls the images the previous job pushed. The box authenticates with its
      # own PULL-ONLY SSM node role, so nothing that can write to the registry
      # ever reaches it.
      - name: Deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          GENEAV_REGISTRY: ${{ vars.ECR_REGISTRY }}
          GENEAV_SSM_NODE: ${{ vars.GENEAV_SSM_NODE }}
        run: ./scripts/deploy-lightsail.sh
