name: CI/CD

# CI runs on every PR and on pushes to main.
# CD (SSH deploy) runs only on pushes to main, and only after both test jobs pass.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------- backend
  backend-test:
    name: Backend · mvn test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: mvn -B clean test

  # --------------------------------------------------------------- frontend
  frontend-build:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (proves the production bundle compiles)
        run: npm run build

  # ----------------------------------------------------------------- deploy
  # Ships the commit to the VM through the Azure control plane (run-command).
  #
  # This deliberately does NOT use SSH. The previous SSH-based job could never
  # have worked: GitHub-hosted runners have dynamic egress IPs but the VM's NSG
  # only allows port 22 from a couple of fixed addresses, and it ran `git pull`
  # on a VM that holds no credentials for this private repo. run-command needs
  # no inbound port and no repo access on the VM.
  #
  # Requires these repo secrets (Settings → Secrets and variables → Actions),
  # from an Entra app federated to this repo — see the setup notes in README:
  #   AZURE_CLIENT_ID        — app registration (client) id
  #   AZURE_TENANT_ID        — directory (tenant) id
  #   AZURE_SUBSCRIPTION_ID  — target subscription
  # There is no client secret: auth is OIDC, so no long-lived credential is
  # stored in GitHub. The old SSH_HOST / SSH_USER / SSH_KEY secrets are unused
  # and should be deleted.
  # ------------------------------------------------------------------ images
  # Built here, not on the VM. Previously the deploy shipped the whole source
  # tree through `az vm run-command` and the VM compiled both apps — which meant
  # builds contended with live traffic, and in July 2026 the payload outgrew
  # Azure's script-size limit and blocked deploys entirely.
  #
  # Tagged with the commit SHA so a deploy is a pull of a known artifact and a
  # rollback is re-pointing at the previous tag.
  #
  # Requires (Settings → Secrets and variables → Actions):
  #   secret   ACR_TOKEN_PASSWORD  — push-scoped ACR token, repo-scoped to these
  #                                  two images only (not a registry admin key)
  #   variable ACR_TOKEN_USER      — e.g. geneav-ci-push
  #   variable ACR_REGISTRY        — e.g. geneavacr.azurecr.io
  images:
    name: Build & push images
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Registry login
        run: |
          echo "${{ secrets.ACR_TOKEN_PASSWORD }}" \
            | docker login "${{ vars.ACR_REGISTRY }}" \
                -u "${{ vars.ACR_TOKEN_USER }}" --password-stdin

      - name: Build & push backend
        run: |
          docker build -t "${{ vars.ACR_REGISTRY }}/geneav-backend:$GITHUB_SHA" ./backend
          docker push "${{ vars.ACR_REGISTRY }}/geneav-backend:$GITHUB_SHA"

      # NEXT_PUBLIC_* are inlined into the client bundle at BUILD time, so they
      # have to be supplied here rather than living in .env.prod on the VM as
      # they used to. None are secrets — they ship to every browser — so they
      # are repository *variables*, not secrets.
      - name: Build & push frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ vars.NEXT_PUBLIC_API_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_UMAMI_WEBSITE_ID="${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}" \
            --build-arg NEXT_PUBLIC_MICROSOFT_LOGIN_ENABLED="${{ vars.NEXT_PUBLIC_MICROSOFT_LOGIN_ENABLED }}" \
            -t "${{ vars.ACR_REGISTRY }}/geneav-frontend:$GITHUB_SHA" ./frontend
          docker push "${{ vars.ACR_REGISTRY }}/geneav-frontend:$GITHUB_SHA"

  # ----------------------------------------------------------------- deploy
  deploy:
    name: Deploy to Azure VM
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token azure/login exchanges
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Pulls the images the previous job pushed. The VM authenticates with its
      # own PULL-ONLY token from .env.prod, so nothing that can write to the
      # registry ever reaches the box.
      - name: Deploy
        env:
          GENEAV_REGISTRY: ${{ vars.ACR_REGISTRY }}
        run: ./scripts/deploy-vm.sh
