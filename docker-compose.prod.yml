# Production override for a single AWS Lightsail instance.
#
# Passing explicit -f files is what keeps docker-compose.override.yml (the dev
# port publishing) out of the picture — see the note in that file.
#
# Requires a .env.prod file (see .env.prod.example) that defines GENEAV_HOST.
# Load it explicitly, e.g.:
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # TLS-terminating reverse proxy. Only this service faces the internet.
  #
  # PULLED, NOT BUILT — same as the two app images, and for a sharper reason. The
  # deploy runs `up -d --no-build`, so a `build:` here could only ever work on a
  # box that had already built the image once. On a freshly provisioned instance
  # there is nothing to run and the first deploy fails on this service. Caddy
  # needs a custom image at all because of the rate-limit plugin (caddy/Dockerfile),
  # so "just use the upstream image" is not an option.
  caddy:
    image: ${GENEAV_REGISTRY:?set GENEAV_REGISTRY (the ECR registry host)}/geneav-caddy:${GENEAV_IMAGE_TAG:?set GENEAV_IMAGE_TAG (the commit SHA)}
    pull_policy: always
    container_name: geneav-caddy
    restart: unless-stopped
    ports:
      - "80:80"    # ACME HTTP-01 challenge + HTTP->HTTPS redirect
      - "443:443"  # HTTPS
    environment:
      GENEAV_HOST: ${GENEAV_HOST:?set GENEAV_HOST in .env.prod (e.g. geneav.20-1-2-3.nip.io)}
      # Derived from GENEAV_HOST so they follow it automatically. This matters
      # during a nip.io staging run: these two names used to be hardcoded to
      # geneav.com, which still resolves to the OLD box, so Caddy would sit in an
      # ACME retry loop for certificates it could never obtain — burning Let's
      # Encrypt failure quota against the real domain before cutover. Derived,
      # they become www.geneav.<ip>.nip.io / analytics.geneav.<ip>.nip.io, which
      # nip.io resolves to this box (it accepts any prefix), so both certificates
      # are issued normally. Override either one explicitly if the real layout
      # ever stops being "www." and "analytics." in front of the apex.
      GENEAV_WWW_HOST: ${GENEAV_WWW_HOST:-www.${GENEAV_HOST}}
      GENEAV_ANALYTICS_HOST: ${GENEAV_ANALYTICS_HOST:-analytics.${GENEAV_HOST}}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # persists issued TLS certificates across restarts
      - caddy-config:/config
    depends_on:
      - frontend
      - backend

  # Images are BUILT IN CI AND PULLED, never built here. The box used to compile
  # both apps on every deploy, which meant builds contended with live traffic and
  # the whole source tree had to be shipped through the cloud control plane — a
  # path that hit its script-size ceiling in July 2026 and could not be raised.
  #
  # The tag is the commit SHA, so a deploy is a pull of a known artifact and a
  # rollback is re-pointing at the previous tag. ECR repositories are configured
  # with IMMUTABLE tags, so a SHA cannot be quietly repointed at different bytes.
  # `pull_policy: always` stops a stale local layer being preferred over what the
  # registry now holds.
  #
  # NOTE: the base compose file still declares `build:` for local development.
  # Compose merges the two, so the deploy script must use `up --no-build` to be
  # certain the pulled image is what runs.
  frontend:
    image: ${GENEAV_REGISTRY:?set GENEAV_REGISTRY (the ECR registry host)}/geneav-frontend:${GENEAV_IMAGE_TAG:?set GENEAV_IMAGE_TAG (the commit SHA)}
    pull_policy: always
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://${GENEAV_HOST}

  backend:
    image: ${GENEAV_REGISTRY:?set GENEAV_REGISTRY (the ECR registry host)}/geneav-backend:${GENEAV_IMAGE_TAG:?set GENEAV_IMAGE_TAG (the commit SHA)}
    pull_policy: always
    restart: unless-stopped
    mem_limit: 1g
    # Bound to the LOOPBACK, not 0.0.0.0. This is the only app port published in
    # production, and it exists so scripts/deploy-lightsail.sh can poll
    # /api/v1/health without going through Caddy and TLS. A loopback bind is not
    # reachable from off-box whatever the Lightsail firewall happens to say, so
    # unlike the old 0.0.0.0 publishing it does not depend on the firewall being
    # right.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GENEAV_ALLOWED_ORIGINS: https://${GENEAV_HOST}
      # Links in transactional email must point at the public host.
      GENEAV_MAIL_LOGIN_URL: https://${GENEAV_HOST}/login
      GENEAV_MAIL_RESET_URL: https://${GENEAV_HOST}/reset-password
      # Where Microsoft sends the buyer back after "Sign in with Microsoft".
      GENEAV_MICROSOFT_POST_LOGIN_URL: https://${GENEAV_HOST}/login

  clamav:
    restart: unless-stopped
    # clamd holds the full signature database resident. MEASURED 26 Jul 2026 on this
    # VM: VmRSS 974 MB, VmHWM 987 MB — about 1 GB, not the ~1.5-2 GB previously
    # asserted here and across the docs.
    #
    # 3g is therefore generous rather than tight, and deliberately so: it is a cap,
    # not a reservation, so unused headroom costs nothing. With
    # CLAMD_CONF_ConcurrentDatabaseReload=no now set in the base compose file, the
    # reload spike that this headroom was really guarding against no longer happens.
    mem_limit: 3g

  postgres:
    restart: unless-stopped
    mem_limit: 512m
    environment:
      # No dev fallback in prod: fail fast if the password is not set in .env.prod.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}

  # Creates the `umami` database if it is missing, then exits.
  #
  # POSTGRES_DB cannot do this: it only runs on FIRST initialisation of the data
  # volume, and that volume was initialised long ago with just `geneav`. The same
  # applies to /docker-entrypoint-initdb.d, which is why this is a service rather
  # than a mounted init script.
  #
  # Checks before creating so it is idempotent across deploys, and so a genuine
  # failure (wrong password, postgres unreachable) still exits non-zero and stops
  # umami from starting, instead of being swallowed by an "already exists" error.
  umami-db-init:
    image: postgres:16-alpine
    container_name: geneav-umami-db-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    entrypoint: ["sh", "-c"]
    # A ONE-ELEMENT list on purpose. A bare string here gets word-split into
    # separate argv entries, so `sh -c` would receive just "if" as its script.
    command:
      - >
        if psql -h postgres -U ${POSTGRES_USER:-geneav} -d ${POSTGRES_DB:-geneav}
        -tAc "SELECT 1 FROM pg_database WHERE datname='umami'" | grep -q 1;
        then echo "umami database already present";
        else createdb -h postgres -U ${POSTGRES_USER:-geneav} umami && echo "created umami database";
        fi

  # Cookieless, self-hosted analytics. Self-hosted specifically so that no visitor
  # data leaves the box and the "no tracking cookies, no consent banner" claim on
  # /privacy stays true — see docs/marketing-plan.md §3.1.
  #
  # Deliberately publishes NO host ports: Caddy reaches it over the compose
  # network at umami:3000. (Adding ports here would also be pointless — see the
  # note at the bottom about Compose merging port lists.)
  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2
    container_name: geneav-umami
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      umami-db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER:-geneav}:${POSTGRES_PASSWORD}@postgres:5432/umami
      # Signs the Umami session token. Fail fast rather than booting with a
      # default that would invalidate every login on the next restart.
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env.prod}
      # NO BASE_PATH. Next.js bakes its base path in at build time, so this
      # prebuilt image serves the UI and the /api/send collection endpoint at the
      # root regardless of what BASE_PATH says at runtime — under the apex that
      # endpoint would collide with the scan API. Caddy gives it
      # analytics.geneav.com instead, where the root is its own.
      #
      # The default tracker filename is on every ad-blocking filter list by name,
      # so it is renamed even though the subdomain is the bigger tell.
      TRACKER_SCRIPT_NAME: s.js
      DISABLE_TELEMETRY: "1"

  # Nightly pg_dump with retention. compliance-roadmap.md §6 item 6.
  #
  # Until now the only backup was an ad-hoc pg_dump documented in db-access.md,
  # which meant the privacy policy's line about records persisting "briefly in
  # backups" described something that did not exist. It does now.
  #
  # Deliberately a dump, not a volume snapshot: a custom-format dump restores
  # selectively with pg_restore and survives a Postgres major-version bump, which
  # a copy of the data directory does not.
  #
  # Each dump is written to a local Docker volume AND copied to S3. The local
  # copy is the fast restore path for the common case (dropped table, bad
  # migration, application bug); the S3 copy is the one that survives losing the
  # instance, which the local copy explicitly does not. Until July 2026 only the
  # local copy existed, which meant the backup did not protect against the single
  # most likely total-loss scenario.
  #
  # BACKUP_S3_BUCKET is optional: leave it unset and the sidecar behaves exactly
  # as it did before, dumping locally only. It should be set in production.
  # The IAM user behind these credentials can ONLY s3:PutObject — it cannot list,
  # read or delete, so a compromised box cannot shred the off-box backups.
  postgres-backup:
    image: postgres:16-alpine
    container_name: geneav-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - postgres-backups:/backups
    entrypoint: ["sh", "-c"]
    # One-element list: a bare string gets word-split and `sh -c` would receive
    # only the first token.
    command:
      - |
        if [ -n "$${BACKUP_S3_BUCKET}" ]; then
          # ~40 MB, installed once per container start rather than baked into a
          # custom image. Not worth a Dockerfile for one binary.
          apk add --no-cache aws-cli >/dev/null 2>&1 || echo "WARN: aws-cli install failed; S3 upload disabled" >&2
        fi
        echo "backup loop started; retention $${BACKUP_RETENTION_DAYS}d, s3=$${BACKUP_S3_BUCKET:-none}"
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          for db in ${POSTGRES_DB:-geneav} umami; do
            out="/backups/$${db}-$${ts}.dump"
            if pg_dump -h postgres -U ${POSTGRES_USER:-geneav} -d "$${db}" -Fc -f "$${out}" 2>/tmp/err; then
              echo "$$(date -u +%FT%TZ) ok   $${out} ($$(du -h "$${out}" | cut -f1))"
              # Upload failure is logged, never fatal: a box that cannot reach S3
              # should still be taking local dumps.
              if [ -n "$${BACKUP_S3_BUCKET}" ] && command -v aws >/dev/null 2>&1; then
                if aws s3 cp "$${out}" "s3://$${BACKUP_S3_BUCKET}/$${db}/$$(basename "$${out}")" >/dev/null 2>/tmp/s3err; then
                  echo "$$(date -u +%FT%TZ) s3   $${db}/$$(basename "$${out}")"
                else
                  echo "$$(date -u +%FT%TZ) S3FAIL $${db}: $$(cat /tmp/s3err)" >&2
                fi
              fi
            else
              # A missing umami database on a fresh box is not a failure worth
              # crash-looping over; a failing geneav dump is worth shouting about.
              echo "$$(date -u +%FT%TZ) FAIL $${db}: $$(cat /tmp/err)" >&2
              rm -f "$${out}"
            fi
          done
          deleted=$$(find /backups -name '*.dump' -mtime +$${BACKUP_RETENTION_DAYS} -print -delete | wc -l)
          [ "$${deleted}" -gt 0 ] && echo "$$(date -u +%FT%TZ) pruned $${deleted} expired dump(s)"
          # Bucket-side expiry is a 14-day lifecycle rule set by
          # aws-provision.sh — the sidecar never deletes anything in S3. 14 is
          # what the privacy policy promises; keep the two in step.
          sleep 86400
        done

volumes:
  caddy-data:
  caddy-config:
  postgres-backups:

# ---------------------------------------------------------------------------
# NOTE ON HOST PORTS — resolved July 2026.
#
# This used to say that 3000/8080/3310/5432 stayed bound on the host in
# production and that the cloud firewall was the only thing keeping them off the
# internet. That is no longer true. The `ports:` blocks moved out of
# docker-compose.yml into docker-compose.override.yml, which Compose auto-loads
# for a bare `docker compose up` but NOT when explicit -f files are passed. The
# base file now publishes nothing, so production publishes:
#
#   caddy    80, 443            the only externally reachable ports
#   backend  127.0.0.1:8080     loopback only, for the deploy health check
#
# The Lightsail instance firewall (80/443, no port 22 — see aws-provision.sh) is
# now a second layer rather than the only one.
# ---------------------------------------------------------------------------
